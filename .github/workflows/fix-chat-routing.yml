name: Fix and verify Empire Chat routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair Nginx routing and verify live chat
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            CHAT_UPSTREAM=http://127.0.0.1:8090
            NGINX_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^nginx:/ {print $1; exit}')"
            if test -n "$NGINX_CONTAINER"; then
              echo "nginx-container=$NGINX_CONTAINER"
              docker inspect "$NGINX_CONTAINER" --format '{{range .Mounts}}{{println .Source "->" .Destination}}{{end}}'
              docker inspect "$NGINX_CONTAINER" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name $network.Gateway $network.IPAddress}}{{end}}'
              ss -lntp | grep ':8090 ' || true
            fi
            BACKUP_DIR=/root/empire-backups/nginx
            mkdir -p "$BACKUP_DIR"
            find /etc/nginx/sites-enabled /etc/nginx/conf.d -maxdepth 1 \
              -type f -name '*.before-chat-fix.*' \
              -exec mv -t "$BACKUP_DIR" {} + 2>/dev/null || true
            VHOST_LINK="$(grep -Rsl 'proxy_pass http://127.0.0.1:3010' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)"
            VHOST="$(readlink -f "$VHOST_LINK")"
            test -n "$VHOST"
            test -f "$VHOST"
            curl --fail --silent --show-error --max-time 10 "$CHAT_UPSTREAM/api/health" >/dev/null
            BACKUP="$BACKUP_DIR/$(basename "$VHOST").before-chat-fix.$(date +%s)"
            cp -aL "$VHOST" "$BACKUP"

            python3 - "$VHOST" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            source = path.read_text()
            marker = "# EMPIRE AI chat routing (managed by fix-chat-routing.yml)"
            block = r'''    # EMPIRE AI chat routing (managed by fix-chat-routing.yml)
                location = /chat { return 308 /chat/; }
                location /chat/ {
                    proxy_pass http://127.0.0.1:8090;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 600s;
                }

            '''
            if marker not in source:
                chat_location = r"location\s+(?:=\s*)?/chat/?\s*"
                source = re.sub(
                    rf"(?m)^\s*{chat_location}\{{[^\n]*\}}\s*$\n?",
                    "",
                    source,
                )
                source = re.sub(
                    rf"(?ms)^\s*{chat_location}\{{\s*\n.*?^\s*\}}\s*\n?",
                    "",
                    source,
                )
                upstream = source.find("proxy_pass http://127.0.0.1:3010")
                locations = list(re.finditer(r"(?m)^\s*location\b.*\{", source[:upstream]))
                if upstream < 0 or not locations:
                    raise SystemExit("dashboard proxy location not found")
                insertion = locations[-1].start()
                source = source[:insertion] + block + source[insertion:]
                path.write_text(source)
            PY

            if ! nginx -t; then
              cp -a "$BACKUP" "$VHOST"
              nginx -t
              exit 1
            fi
            if systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              nginx -s reload
            fi

            curl --fail --silent --show-error --max-time 15 https://www.6-empires.com/chat/ -o /tmp/empire-chat-page
            grep -q 'EMPIRE AI' /tmp/empire-chat-page
            ! grep -q '__next_f.push' /tmp/empire-chat-page

            response="$(curl --fail --silent --show-error --max-time 120 \
              -H 'Content-Type: application/json' \
              -d '{"model":"empire-prime","mode":"empire","route":"local","messages":[{"role":"user","content":"Reply with exactly: EMPIRE CHAT VERIFIED"}]}' \
              "$CHAT_UPSTREAM/chat/api/chat")"
            test -n "$response"
            ! grep -q '__next_f.push\|This page could not be found' <<<"$response"
            printf 'Verified live chat response: %.300s\n' "$response"
