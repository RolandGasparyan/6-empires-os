name: Fix and verify Empire Chat routing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair Nginx routing and verify live chat
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: OPENROUTER_API_KEY
          command_timeout: 10m
          script: |
            set -Eeuo pipefail
            CHAT_UPSTREAM=http://127.0.0.1:8090
            NGINX_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^nginx:/ {print $1; exit}')"
            if test -n "$NGINX_CONTAINER"; then
              echo "nginx-container=$NGINX_CONTAINER"
              CONFIG_DIR="$(docker inspect "$NGINX_CONTAINER" --format '{{range .Mounts}}{{if eq .Destination "/etc/nginx/conf.d"}}{{.Source}}{{end}}{{end}}')"
              GATEWAY="$(docker inspect "$NGINX_CONTAINER" --format '{{range $name, $network := .NetworkSettings.Networks}}{{$network.Gateway}}{{end}}')"
              VHOST_LINK="$(grep -Rsl 'proxy_pass http://web:3000' "$CONFIG_DIR" | head -1)"
              CHAT_PROXY="http://$GATEWAY:8090"
            else
              VHOST_LINK="$(grep -Rsl 'proxy_pass http://127.0.0.1:3010' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null | head -1)"
              CHAT_PROXY="$CHAT_UPSTREAM"
            fi
            ss -lntp | grep ':8090 '
            BACKUP_DIR=/root/empire-backups/nginx
            mkdir -p "$BACKUP_DIR"
            find /etc/nginx/sites-enabled /etc/nginx/conf.d -maxdepth 1 \
              -type f -name '*.before-chat-fix.*' \
              -exec mv -t "$BACKUP_DIR" {} + 2>/dev/null || true
            VHOST="$(readlink -f "$VHOST_LINK")"
            test -n "$VHOST"
            test -f "$VHOST"
            curl --fail --silent --show-error --max-time 10 "$CHAT_UPSTREAM/api/health" >/dev/null
            BACKUP="$BACKUP_DIR/$(basename "$VHOST").before-chat-fix.$(date +%s)"
            cp -aL "$VHOST" "$BACKUP"

            python3 - "$VHOST" "$CHAT_PROXY" <<'PY'
            from pathlib import Path
            import re
            import sys

            path = Path(sys.argv[1])
            chat_proxy = sys.argv[2]
            source = path.read_text()
            marker = "# EMPIRE AI chat routing (managed by fix-chat-routing.yml)"
            block = f'''    # EMPIRE AI chat routing (managed by fix-chat-routing.yml)
                location = /chat {{ return 308 /chat/; }}
                location /chat/ {{
                    proxy_pass {chat_proxy};
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_buffering off;
                    proxy_cache off;
                    proxy_read_timeout 600s;
                }}

            '''
            if marker not in source:
                chat_location = r"location\s+(?:=\s*)?/chat/?\s*"
                source = re.sub(
                    rf"(?m)^\s*{chat_location}\{{[^\n]*\}}\s*$\n?",
                    "",
                    source,
                )
                source = re.sub(
                    rf"(?ms)^\s*{chat_location}\{{\s*\n.*?^\s*\}}\s*\n?",
                    "",
                    source,
                )
                upstream = max(
                    source.find("proxy_pass http://web:3000"),
                    source.find("proxy_pass http://127.0.0.1:3010"),
                )
                locations = list(re.finditer(r"(?m)^\s*location\b.*\{", source[:upstream]))
                if upstream < 0 or not locations:
                    raise SystemExit("dashboard proxy location not found")
                insertion = locations[-1].start()
                source = source[:insertion] + block + source[insertion:]
                path.write_text(source)
            PY

            test_config() {
              if test -n "$NGINX_CONTAINER"; then docker exec "$NGINX_CONTAINER" nginx -t;
              else nginx -t; fi
            }
            if ! test_config; then
              cp -a "$BACKUP" "$VHOST"
              test_config
              exit 1
            fi
            if test -n "$NGINX_CONTAINER"; then
              docker exec "$NGINX_CONTAINER" nginx -s reload
            elif systemctl is-active --quiet nginx; then
              systemctl reload nginx
            else
              nginx -s reload
            fi

            # Compatibility for the older live server: branded empire-* names
            # are routing aliases, not installed Ollama model names.
            SERVER=/opt/empire-ai-chat/server.js
            if grep -qE 'const model = payload\.model \|\| DEFAULT_MODEL|empireChat\(DEFAULT_MODEL, messages\)\.then|num_ctx: 8192 \}' "$SERVER"; then
              cp -a "$SERVER" "$BACKUP_DIR/server.js.before-model-alias.$(date +%s)"
              python3 - "$SERVER" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            source = path.read_text()
            source = source.replace(
                "function empireChat(DEFAULT_MODEL, messages)",
                "function empireChat(model, messages)",
            )
            source = source.replace(
                "empireChat(DEFAULT_MODEL, messages).then",
                "empireChat(model, messages).then",
            )
            source = source.replace(
                "const model = payload.model || DEFAULT_MODEL;",
                "const requestedModel = payload.model || DEFAULT_MODEL;\n      const model = isEmpire(requestedModel) ? DEFAULT_MODEL : requestedModel;",
            )
            source = source.replace(
                "temperature: 0.7, num_ctx: 8192 }",
                "temperature: 0.7, num_ctx: 8192, num_predict: 128 }",
            )
            path.write_text(source)
            PY
              systemctl restart empire-ai
              sleep 3
              curl --fail --silent --show-error --max-time 10 "$CHAT_UPSTREAM/api/health" >/dev/null
            fi

            # Add the OpenRouter/NVIDIA route to the older live server without
            # exposing the credential in the repository or workflow logs.
            test -n "${OPENROUTER_API_KEY:-}"
            if ! grep -q 'EMPIRE_OPENROUTER_NVIDIA' "$SERVER"; then
              cp -a "$SERVER" "$BACKUP_DIR/server.js.before-openrouter.$(date +%s)"
              python3 - "$SERVER" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            source = path.read_text()
            source = source.replace(
                "const DEFAULT_MODEL = process.env.EMPIRE_MODEL || 'llama3.2:1b';",
                "const DEFAULT_MODEL = process.env.EMPIRE_MODEL || 'llama3.2:1b';\nconst OPENROUTER_KEY = process.env.OPENROUTER_API_KEY || '';",
            )
            provider = r'''
            // EMPIRE_OPENROUTER_NVIDIA: allowlisted hosted chat models only.
            const OPENROUTER_NVIDIA = new Set([
              'moonshotai/kimi-k3',
              'nvidia/nemotron-3-ultra-550b-a55b:free',
              'nvidia/nemotron-3-super-120b-a12b:free',
              'nvidia/nemotron-3-nano-30b-a3b:free',
            ]);
            function openRouterChat(model, messages) {
              return new Promise((resolve, reject) => {
                const https = require('https');
                const data = JSON.stringify({ model, messages, stream: false, max_tokens: 512 });
                const req = https.request(
                  { hostname: 'openrouter.ai', path: '/api/v1/chat/completions', method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + OPENROUTER_KEY,
                      'HTTP-Referer': 'https://www.6-empires.com', 'X-OpenRouter-Title': '6-EMPIRES Chat',
                      'Content-Length': Buffer.byteLength(data) } },
                  (up) => { let body = ''; up.on('data', (c) => (body += c)); up.on('end', () => {
                    try {
                      const parsed = JSON.parse(body);
                      if (up.statusCode < 200 || up.statusCode >= 300) throw new Error(parsed.error?.message || `OpenRouter ${up.statusCode}`);
                      resolve(parsed.choices[0].message.content);
                    } catch (error) { reject(error); }
                  }); }
                );
                req.setTimeout(180000, () => req.destroy(new Error('OpenRouter timeout')));
                req.on('error', reject); req.write(data); req.end();
              });
            }

            '''
            source = source.replace('// Call the EMPIRE router', provider + '// Call the EMPIRE router')
            route = r'''      if (OPENROUTER_NVIDIA.has(model)) {
                    res.writeHead(200, { 'Content-Type': 'text/plain; charset=utf-8', 'Cache-Control': 'no-cache', 'X-Accel-Buffering': 'no' });
                    if (!OPENROUTER_KEY) return res.end('OpenRouter is not configured');
                    openRouterChat(model, messages).then((text) => res.end(text || '…')).catch((error) => res.end('OpenRouter error: ' + error.message));
                    return;
                  }

            '''
            source = source.replace('      // EMPIRE models → HYBRID', route + '      // EMPIRE models → HYBRID')
            path.write_text(source)
            PY
            elif ! grep -q 'moonshotai/kimi-k3' "$SERVER"; then
              python3 - "$SERVER" <<'PY'
            from pathlib import Path
            import sys

            path = Path(sys.argv[1])
            source = path.read_text()
            source = source.replace(
                "const OPENROUTER_NVIDIA = new Set([",
                "const OPENROUTER_NVIDIA = new Set([\n  'moonshotai/kimi-k3',",
            )
            path.write_text(source)
            PY
            fi
            mkdir -p /etc/systemd/system/empire-ai.service.d
            umask 077
            printf '[Service]\nEnvironment="OPENROUTER_API_KEY=%s"\n' "$OPENROUTER_API_KEY" \
              > /etc/systemd/system/empire-ai.service.d/zz-openrouter.conf
            systemctl daemon-reload

            # Keep interactive chat responsive. The 8B multilingual model is
            # available for explicit selection, but is too slow as the default.
            if curl --fail --silent --show-error http://127.0.0.1:11434/api/tags \
              | grep -q '"name":"llama3.2:latest"'; then
              mkdir -p /etc/systemd/system/empire-ai.service.d
              cat > /etc/systemd/system/empire-ai.service.d/zz-interactive-model.conf <<'EOF'
            [Service]
            Environment="EMPIRE_MODEL=llama3.2:latest"
            EOF
              systemctl daemon-reload
              systemctl restart empire-ai
              sleep 3
              curl --fail --silent --show-error --max-time 10 "$CHAT_UPSTREAM/api/health" >/dev/null
            fi

            UI_TMP="$(mktemp)"
            curl --fail --silent --show-error \
              "https://raw.githubusercontent.com/RolandGasparyan/6-empires-os/${{ github.sha }}/empire-ai-chat/index.html" \
              -o "$UI_TMP"
            grep -q 'data-model="KIMI K3"' "$UI_TMP"
            cp -a /opt/empire-ai-chat/index.html "$BACKUP_DIR/index.html.before-kimi-k3.$(date +%s)"
            install -m 0644 "$UI_TMP" /opt/empire-ai-chat/index.html
            rm -f "$UI_TMP"
            systemctl restart empire-ai
            sleep 3
            curl --fail --silent --show-error --max-time 10 "$CHAT_UPSTREAM/api/health" >/dev/null
            curl --fail --silent --show-error --max-time 15 \
              --retry 5 --retry-all-errors --retry-delay 2 \
              https://www.6-empires.com/chat/ -o /tmp/empire-chat-page
            grep -q 'EMPIRE AI' /tmp/empire-chat-page
            grep -q 'data-model="KIMI K3"' /tmp/empire-chat-page
            grep -q 'data-model="NEMOTRON ULTRA"' /tmp/empire-chat-page
            ! grep -q '__next_f.push' /tmp/empire-chat-page

            response="$(curl --fail --silent --show-error --max-time 180 \
              -H 'Content-Type: application/json' \
              -d '{"model":"empire-prime","mode":"empire","route":"hybrid","messages":[{"role":"user","content":"hi"}]}' \
              "$CHAT_UPSTREAM/chat/api/chat")"
            test -n "$response"
            ! grep -q '__next_f.push\|This page could not be found\|router unreachable\|model is not defined\|⚠️' <<<"$response"
            printf 'Verified live chat response: %.300s\n' "$response"
